name: COBOL Check Automation

on:
  push:
    branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Mainframe Environment and Upload COBOL Check
      env:
        ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
        ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
      run: |
        sudo apt-get install dos2unix
        dos2unix .github/scripts/zowe_operations.sh
        npm install -g @zowe/cli@zowe-v2-lts
        zowe profiles create zosmf-profile default --host 204.90.115.200 --port 10443 --user ${{ secrets.ZOWE_USERNAME }} --password ${{ secrets.ZOWE_PASSWORD }} --reject-unauthorized false --overwrite
        chmod +x .github/scripts/zowe_operations.sh
        .github/scripts/zowe_operations.sh