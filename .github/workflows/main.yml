name: COBOL Check Automation

on:
  push:
    branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Java
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Setup Mainframe Environment and Upload COBOL Check
      env:
        ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
        ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
      run: |
        npm install -g @zowe/cli
        zowe config create --global-config true --user ${{ secrets.ZOWE_USERNAME }} --password ${{ secrets.ZOWE_PASSWORD }} --host zos.zxp.ibm.com --port 10443 --reject-unauthorized false
        chmod +x .github/scripts/zowe_operations.sh
        .github/scripts/zowe_operations.sh